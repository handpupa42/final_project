{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4 shadow-sm border-0">
            <h3 class="mb-3">Регистрация</h3>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-pink w-100 mt-3">Зарегистрироваться</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
