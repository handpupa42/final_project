{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card p-4 border-secondary shadow-lg">
            <h3 class="mb-4">Добавление нового товара </h3>
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-beauty btn-lg w-100 mt-3">Опубликовать товар</button>
            </form>
            <a href="{% url 'shop:seller_dashboard' %}" class="btn btn-outline-secondary w-100 mt-2">&larr; Назад в кабинет</a>
        </div>
    </div>
</div>
{% endblock %}
