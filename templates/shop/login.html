{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-5">
        <div class="card p-4 shadow-sm border-0" style="background-color: white; border-radius: 20px;">
            <h3 class="mb-3 text-center">Вход в аккаунт ✨</h3>
            <p class="text-muted text-center small mb-4">Войдите для доступа к корзине и покупкам</p>

            {% if form.errors %}
                <div class="alert alert-danger py-2 small">Неверное имя пользователя или пароль.</div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
            
                {% if request.GET.next %}
                    <input type="hidden" name="next" value="{{ request.GET.next }}">
                {% endif %}

                <div class="mb-3">
                    <label class="form-label small fw-bold">Имя пользователя:</label>
                    <input type="text" name="username" class="form-control rounded-pill px-3" required autofocus>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-bold">Пароль:</label>
                    <input type="password" name="password" class="form-control rounded-pill px-3" required>
                </div>

                <button type="submit" class="btn btn-beauty
 w-100 mt-2">Войти</button>
            </form>

            <p class="mt-4 text-center small text-muted">
                Ещё нет аккаунта? <a href="{% url 'shop:register' %}" class="text-danger text-decoration-none fw-bold">Зарегистрироваться</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
