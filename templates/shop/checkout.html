{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card p-4 shadow-sm border-0">
            <h3 class="mb-4">Оформление заказа</h3>
            <h5>Сумма к оплате: <span class="text-danger">{{ total_cost }} ₽</span></h5>
            <hr>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-pink btn-lg w-100 mt-3">Подтвердить заказ</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
