<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Glow & Beauty{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        :root {
            --bg-black: #000000;
            --card-dark: #121212;
            --primary-pink: #d63384;
            --luxury-gold: #c5a880;
            --text-white: #ffffff;
            --text-gray: #a0a0a0;
        }

        body { 
            background-color: var(--bg-black); 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            color: var(--text-white);
        }

        h1, h2, h3, .navbar-brand { font-family: 'Outfit', sans-serif; }

        .navbar {
            background-color: var(--bg-black) !important;
            border-bottom: 1px solid #222;
        }
        .navbar-brand { color: var(--primary-pink) !important; font-weight: 800; }
        .nav-link { color: var(--text-white) !important; font-size: 0.9rem; text-transform: uppercase; }
        .nav-link:hover { color: var(--primary-pink) !important; }
        .card {
            background-color: var(--card-dark);
            border: 1px solid #222;
            border-radius: 15px;
            transition: all 0.3s;
        }
        .card:hover { border-color: var(--primary-pink); transform: translateY(-5px); }
        .card-title { color: var(--text-white); }
        .text-muted { color: var(--text-gray) !important; }

        .btn-pink {
            background-color: var(--primary-pink);
            color: white;
            border-radius: 50px;
            padding: 10px 25px;
            border: none;
        }
        .btn-pink:hover { background-color: #b8256f; color: white; box-shadow: 0 0 15px var(--primary-pink); }
        
        .btn-outline-gold {
            border: 1px solid var(--luxury-gold);
            color: var(--luxury-gold);
            border-radius: 50px;
        }
        .btn-outline-gold:hover { background-color: var(--luxury-gold); color: black; }

        .form-control {
            background-color: #1a1a1a;
            border: 1px solid #333;
            color: white;
        }
        .form-control:focus { background-color: #222; color: white; border-color: var(--primary-pink); box-shadow: none; }
        
        footer { border-top: 1px solid #222; padding: 40px 0; color: var(--text-gray); }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg py-3 sticky-top">
        <div class="container">
            <a class="navbar-brand" href="{% url 'shop:product_list' %}">✨ GLOW & BEAUTY</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="{% url 'shop:product_list' %}">Каталог</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'shop:buy_gift_card' %}" style="color: var(--luxury-gold) !important;">🎁 Подарочные карты</a></li>
                </ul>
                <div class="d-flex align-items-center">
                    {% if user.is_authenticated %}
                        <a href="{% url 'shop:cart_detail' %}" class="btn btn-outline-gold btn-sm me-3">🛒 Корзина</a>
                        <span class="me-3">{{ user.username }}</span>
                        <form action="{% url 'logout' %}" method="post" class="d-inline">{% csrf_token %}<button class="btn btn-sm text-white">Выйти</button></form>
                    {% else %}
                        <a href="{% url 'login' %}" class="btn btn-sm text-white me-2">Войти</a>
                        <a href="{% url 'shop:register' %}" class="btn btn-pink btn-sm">Регистрация</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center">
        <p>&copy; 2026 GLOW & BEAUTY. DARK EDITION.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
